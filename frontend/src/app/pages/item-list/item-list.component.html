<div class="container">
  <h2>Lista de Tarefas (Angular + Node)</h2>

  <div class="form-group">
    <input 
      type="text" 
      [(ngModel)]="newItemName" 
      placeholder="Digite um novo item..."
    />
    <button (click)="addItem()">Adicionar</button>
  </div>

  <ul class="item-list">
    <li *ngFor="let item of items()">
      <span>{{ item.name }}</span>
      <button class="btn-delete" (click)="deleteItem(item.id)">Excluir</button>
    </li>
  </ul>

  <p *ngIf="items().length === 0" class="empty-message">Nenhum item cadastrado.</p>
</div>
