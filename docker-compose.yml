version: '3.8'

services:
  api:
    build: ./api
    container_name: clash_api
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env

  frontend:
      build: ./frontend
      container_name: clash_frontend
      restart: always
      ports:
        - "4200:4200"
      command: npx ng serve --host 0.0.0.0 --port 4200 --allowed-hosts=all
      depends_on:
        - api